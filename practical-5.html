<html>
    <head>
        <title> PRACTICAL-5 </title>
        <style>
             .p1{
                border-left: 5px solid #00ff40;
                border-right: 5px solid #00ff40;
                border-top: 5px solid #00ff40;
                border-bottom: 5px solid #00ff40;
            }
            .p2{
                border-left: 5px solid blue;
                border-right: 5px solid red;
                border-top: 5px solid #00ff40;
                border-bottom: 5px solid yellow;
            }
        </style>
    </head>
    <body>
       <p class="p1">This is a solid border with lime color.</p>
       <p class="p2">This is a solid border with 4 color lime on top, red <br>on right, yellow on bottom, blue on left border.</p>

    </body>
</html>
