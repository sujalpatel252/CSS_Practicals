<html>
    <head>
        <title> BORDER-STYLE </title>
        <style>
            body {
                background-color: black;
                text-align: center;
            }
            .border1 {
                border: 10px solid orange; 
            }
            .border2 {
                border: 10px double purple; 
            }
            .border3 {
                border: 10px inset greenyellow; 
            }
            .border4 {
                border: 10px outset navy; 
            }
        </style>
    </head>
    <body>
        <h2 class="border1" style="color: white;">Border Styles 1</h2>
        <h2 class="border2" style="color: white;">Border Styles 2</h2>
        <h2 class="border3" style="color: white;">Border Styles 3</h2>
        <h2 class="border4" style="color: white;">Border Styles 4</h2>
    </body>
</html>
