<html>
    <head>
        <title> BORDER-CSS </title>
        <style>
            .border1 {
                border: 2px dotted red;
            }
            .border2 {
                border: 2px dashed blue;
            }
            .border3 {
                border: 3px solid cyan;
            }
            .border4 {
                border: 4px double olive;
            }
            .border5 {
                border: 5px groove teal;
            }
            .border6 {
                border: 6px ridge orange;
            }
            .border7 {
                border: 7px inset maroon;
            }
            .border8 {
                border: 8px outset hotpink;
            }
            body {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1 class="border1">dotted</h1>
        <h1 class="border2">dashed</h1>
        <h1 class="border3">solid</h1>
        <h1 class="border4">double</h1>
        <h1 class="border5">groove</h1>
        <h1 class="border6">ridge</h1>
        <h1 class="border7">inset</h1>
        <h1 class="border8">outset</h1>
    </body>
</html>
