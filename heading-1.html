<html>
    <head>
        <title> HEADING-CSS </title>
        <style>
            h1 {
                color:red; 
                background-color:green; 
                font-size:50px; 
                font-weight:800; 
                text-decoration:underline;
            }

            h2 {
                color:silver; 
                background-color:yellow; 
                font-size:60px; 
                font-weight:800; 
                text-decoration:underline;
            }

            h3 {
                color:pink; 
                background-color:blue; 
                font-size:80px; 
                font-weight:800; 
                text-decoration:underline;
            }

            h4 {
                color:seagreen; 
                background-color:navy; 
                font-size:70px; 
                font-weight:800; 
                text-decoration:underline;
            }

            h5 {
                color:brown; 
                background-color:teal; 
                font-size:90px; 
                font-weight:800; 
                text-decoration:underline;
            }

            h6 {
                color:blueviolet; 
                background-color:palegreen; 
                font-size:40px; 
                font-weight:800; 
                text-decoration:underline;
            }
        </style>
    </head>
    <body>
        <h1>Hellow World</h1>
        <h2>Hellow World</h2>
        <h3>Hellow World</h3>
        <h4>Hellow World</h4>
        <h5>Hellow World</h5>
        <h6>Hellow World</h6>
    </body>
</html>
